name: Validate Portfolio Boutique Overlay

on:
  pull_request:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'scripts/validate-portfolio-overlay.sh'
      - '.github/workflows/portfolio-overlay-validate.yml'
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'scripts/validate-portfolio-overlay.sh'
      - '.github/workflows/portfolio-overlay-validate.yml'

permissions:
  contents: read

jobs:
  render:
    name: Render development overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - run: ./scripts/validate-portfolio-overlay.sh
